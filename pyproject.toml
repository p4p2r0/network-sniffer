[project]
name = "network-sniffer"
version = "0.1.1"
description = "TUI network packet sniffer"
readme = "README.md"
authors = [
    { name = "p4p2r0", email = "294768138+p4p2r0@users.noreply.github.com" }
]
requires-python = ">=3.11"
dependencies = [
    "scapy>=2.7.0",
    "textual>=8.2.8",
]

[project.scripts]
network-sniffer = "network_sniffer:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"
